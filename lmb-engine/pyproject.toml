[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmb-engine"
version = "0.8.0"
description = "Расчётный модуль LMB BioAge: клинические индексы, применимость, модель v0.3"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["lmb_engine"]
