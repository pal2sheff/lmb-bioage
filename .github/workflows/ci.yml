name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Расчётный модуль
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: pip install -e "lmb-engine[test]"
      - name: Тесты
        working-directory: lmb-engine
        run: python -m pytest -q -rs

  server-web:
    name: Сервер, интерфейс и сквозная проверка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lmb-web/package-lock.json
      - name: PostgreSQL 16 (только бинарные файлы; кластер поднимают сами тесты)
        run: |
          if ! ls /usr/lib/postgresql/16/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Установка Python-зависимостей
        run: |
          pip install -e lmb-engine
          pip install -e "lmb-server[test]"
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Тесты сервера
        working-directory: lmb-server
        run: python -m pytest -q -rf
      - name: Сборка интерфейса
        working-directory: lmb-web
        run: |
          npm ci
          npm run build
      - name: Сквозная проверка в браузере
        working-directory: lmb-web
        run: python e2e/run_e2e.py
      - name: Снимки экрана сквозной проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: lmb-web/e2e/screens/
          if-no-files-found: ignore

  windows-local:
    name: Локальный запуск на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lmb-web/package-lock.json
      - name: Пакеты и сборка интерфейса
        shell: pwsh
        run: |
          python -m pip install --quiet -e lmb-engine -e lmb-server
          Push-Location lmb-web; npm ci --no-audit --no-fund; npm run build; Pop-Location
      - name: Первичная настройка (база в папке данных, ключи, врач)
        shell: pwsh
        env:
          LMB_HOME: ${{ runner.temp }}\lmb-home
          LMB_BOOTSTRAP_PASSWORD: ci-password-2026
          PYTHONUTF8: "1"
        run: |
          # на образе есть PostgreSQL; lmb_local.py сам находит initdb в Program Files
          Get-ChildItem "$env:ProgramFiles\PostgreSQL\*\bin\initdb.exe" | Select-Object -First 1
          python local/lmb_local.py setup --email doctor@ci.local --name "CI"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Запуск сайта, вход, карточка пациента, остановка
        shell: pwsh
        env:
          LMB_HOME: ${{ runner.temp }}\lmb-home
          PYTHONUTF8: "1"
        run: |
          $p = Start-Process python -ArgumentList "local/lmb_local.py","start","--no-browser" -PassThru -NoNewWindow `
               -RedirectStandardOutput "$env:RUNNER_TEMP\start.out" -RedirectStandardError "$env:RUNNER_TEMP\start.err"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/v1/health; if ($h.status -eq "ok") { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\start.out","$env:RUNNER_TEMP\start.err"; exit 1 }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/v1/auth/login -WebSession $s `
                   -ContentType "application/json" -Body '{"email":"doctor@ci.local","password":"ci-password-2026"}'
          $hdr = @{ "X-CSRF-Token" = $login.csrf_token }
          $body = @{ last_name = "Проверочная"; first_name = "Алия"; birth_date = "1970-01-01"; sex_at_birth = "female" } | ConvertTo-Json
          $pt = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/v1/patients -WebSession $s -Headers $hdr `
                -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          $found = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/v1/patients?query=$([uri]::EscapeDataString('проверочная'))" -WebSession $s
          if ($found.Count -ne 1 -or $found[0].id -ne $pt.id) { Write-Error "поиск по фамилии не сработал"; exit 1 }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/
          if ($page.StatusCode -ne 200) { exit 1 }
          Stop-Process -Id $p.Id -Force
          python local/lmb_local.py backup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python local/lmb_local.py stop
          python local/lmb_local.py status
